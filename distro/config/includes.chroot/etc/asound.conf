# Music and credit FX share ALSA through dmix. Override card for non-default hardware.
pcm.jukebox_mix {
    type dmix
    ipc_key 73142
    ipc_key_add_uid true
    slave { pcm "hw:0,0" rate 48000 channels 2 period_size 1024 buffer_size 8192 }
}
pcm.!default { type plug slave.pcm "jukebox_mix" }
ctl.!default { type hw card 0 }
