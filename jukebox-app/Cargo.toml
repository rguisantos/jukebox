[package]
name = "jukebox-app"
version = "1.0.0"
edition = "2021"
authors = ["Jukebox Embedded Project"]
description = "High-performance embedded Jukebox software optimized for legacy x86 hardware"

[features]
default = []
# Perfil legacy (fase 1 — Jukebox TV na base antiga, ver JUKEBOXTV-LEGACY.md):
# catálogo, créditos, fila e relatórios no PostgreSQL 9.1 `jukeboxtvdb`
# original, em vez do SQLite local, e player libVLC carregado por soname
# (dlopen) — o binário não linka VLC/X11 em tempo de build. Pix e
# sincronização online são recursos do próprio app Rust e continuam
# disponíveis nos dois perfis.
legacy-pg = ["dep:tokio-postgres", "dep:libloading"]

[dependencies]
ring = "0.17"
gstreamer-app = "0.22"
# GUI Framework
# Fixado em 1.8.0 (a partir do 1.9 o suporte a X11 mudou de novo).
# backend-winit-x11 = backend X11 puro via winit, SEM Wayland (binário menor);
# o renderer FemtoVG (OpenGL) vem embutido como renderer padrão deste backend.
# Correção em relação ao Cargo.toml original: os nomes "backend-x11" e
# "renderer-femtovg" não existem no slint 1.8.0 (eram de versões antigas).
slint = { version = "=1.8.0", default-features = false, features = ["std", "backend-winit-x11", "renderer-femtovg", "renderer-software", "compat-1-2", "raw-window-handle-06"] }

# Handle de janela compatível com o backend Slint/X11.
raw-window-handle = "0.6"

# Asynchronous Runtime (Configurado estritamente para eficiência em Single-Core)
# 'net' e 'io-util' são exigidos pelo reqwest (polling PIX) dentro do runtime Tokio.
tokio = { version = "1.40", default-features = false, features = ["rt", "sync", "macros", "time", "net", "io-util"] }

# Banco de Dados SQLite embutido
rusqlite = { version = "0.32", features = ["bundled"] }

# =============================================================================
# MÓDULO LEGACY — PostgreSQL 9.1 `jukeboxtvdb` (feature `legacy-pg`)
# Cliente do protocolo v3, que o PG 9.1 fala sem ressalvas. Opcional: o
# perfil modern (SQLite) não carrega esta dependência no binário.
# =============================================================================
tokio-postgres = { version = "0.7", optional = true }

# libVLC 1.1 e libX11 carregadas por soname no perfil legacy (o VLC da
# base antiga não tem -dev; o mesmo binário roda nas duas fases).
libloading = { version = "0.8", optional = true }

# Leitor de tags ID3 (metadados de arquivos MP3)
id3 = "1.14"

# =============================================================================
# MÓDULO 3 — Player de Mídia (GStreamer)
# Playbin + appsink RGB limitado (vídeo composto no Slint com overlays)
# + alsasink (áudio direto no ALSA, sem PulseAudio/PipeWire).
# Versão 0.22 exige GStreamer >= 1.20 (Debian 12 Bookworm roda 1.22).
# =============================================================================
gstreamer = "0.22"
gstreamer-video = "0.22"

# =============================================================================
# MÓDULO 5 — Integração PIX (QR Code Dinâmico + Polling de Status)
# reqwest com rustls (TLS puro em Rust): elimina dependência do OpenSSL nativo
# na máquina legada. Sem features padrão para manter o binário enxuto.
# =============================================================================
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Geração do QR Code a partir do payload EMV ("PIX Copia e Cola").
# Sem features padrão: renderizamos os módulos manualmente em buffer RGB,
# que é convertido em textura via slint::Image::load_from_rgb8().
qrcode = { version = "0.14", default-features = false }

# =============================================================================
# MÓDULO 7 — Capas de álbum (navegação por discos)
# Decodifica as artes embutidas nos MP3 (frame ID3 APIC) e gera miniaturas
# 256x256 com cache em /dados/capas. Features mínimas (só jpeg/png, sem
# rayon/parallel) — a crate já entra no build via slint/femtovg, custo zero.
# =============================================================================
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

# Utilitários de Comunicação e Logging
log = "0.4"
env_logger = "0.11"

# Prioridade real-time na thread do player (SCHED_FIFO) — precisa CAP_SYS_NICE
libc = "0.2"

[build-dependencies]
slint-build = "=1.8.0"

# Otimizações estritas para hardware legado (AMD Sempron 145 / Core 2 Duo)
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
