[package]
name = "jukebox-app"
version = "1.0.0"
edition = "2021"
authors = ["Jukebox Embedded Project"]
description = "High-performance embedded Jukebox software optimized for legacy x86 hardware"

[dependencies]
# GUI Framework
slint = { version = "1.8", default-features = false, features = ["backend-x11", "renderer-femtovg", "compat-1-2"] }

# Asynchronous Runtime (Configurado estritamente para eficiência em Single-Core)
tokio = { version = "1.40", default-features = false, features = ["rt", "sync", "macros", "time"] }

# Banco de Dados SQLite embutido
rusqlite = { version = "0.32", features = ["bundled"] }

# Leitor de tags ID3 (metadados de arquivos MP3)
id3 = "1.14"

# Utilitários de Comunicação e Logging
log = "0.4"
env_logger = "0.11"

[build-dependencies]
slint-build = "1.8"

# Otimizações estritas para hardware legado (AMD Sempron 145 / Core 2 Duo)
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
